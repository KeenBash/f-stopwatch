name: Android Release

# 触发方式：
# 1. 把 master 合并进 package 分支后 push（合并产生的提交会触发本工作流）
# 2. 在 Actions 页面手动 Run workflow
on:
  push:
    branches: [package]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Read version from pubspec
        id: version
        run: echo "value=$(grep -E '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: flutter pub get

      # release 包当前使用 debug 签名（见 android/app/build.gradle.kts），
      # 正式分发前需配置自己的 keystore。
      - name: Build release APK (arm64)
        run: flutter build apk --release --target-platform android-arm64

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: f-stopwatch-v${{ steps.version.outputs.value }}-arm64
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
